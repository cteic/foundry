name: Sticky comment

# Keeps one comment per pull request per marker. A later run edits the comment
# in place. The body comes from an artifact that an earlier job in the same run
# uploaded, so the job that runs repo code never holds a token that can write.

on:
  workflow_call:
    inputs:
      marker:
        description: Name of the comment. Lower-case letters, digits and hyphens. One comment per pull request per marker.
        type: string
        required: true
      artifact:
        description: Artifact from this run that holds the comment body.
        type: string
        required: true
      file:
        description: Markdown file inside the artifact.
        type: string
        default: comment.md

permissions: {}

jobs:
  comment:
    name: Comment on the pull request
    # A pull request from a fork gets a read-only token, so the job is skipped
    # there. The measuring job still writes the same text to the job summary.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pull-requests: write
    concurrency:
      group: sticky-comment-${{ github.repository }}-${{ github.event.pull_request.number }}-${{ inputs.marker }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/sticky-comment
      - name: Create or update the comment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MARKER: ${{ inputs.marker }}
          FILE: ${{ inputs.file }}
        run: |
          set -euo pipefail

          if [[ ! "$MARKER" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]]; then
            echo "::error::marker must be lower-case letters, digits and hyphens."
            exit 1
          fi
          if [[ ! "$FILE" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::file must be a plain file name."
            exit 1
          fi
          source="$RUNNER_TEMP/sticky-comment/$FILE"
          if [ ! -s "$source" ]; then
            echo "::error::The artifact has no $FILE."
            exit 1
          fi

          # GitHub rejects a comment over 65536 characters.
          tag="<!-- $MARKER -->"
          body="$RUNNER_TEMP/sticky-comment-body.md"
          {
            printf '%s\n' "$tag"
            head -c 60000 "$source"
          } > "$body"
          if [ "$(wc -c < "$source")" -gt 60000 ]; then
            printf '\n\nThe report was cut short. The job summary has all of it.\n' >> "$body"
          fi

          # Only a comment this workflow wrote is ever edited.
          existing="$(
            gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" |
              jq --raw-output --arg tag "$tag" \
                '.[] | select(.user.login == "github-actions[bot]" and (.body | startswith($tag))) | .id' |
              head -n 1
          )"

          if [ -n "$existing" ]; then
            request=(--method PATCH "repos/$REPO/issues/comments/$existing")
          else
            request=(--method POST "repos/$REPO/issues/$PR_NUMBER/comments")
          fi
          if ! output="$(gh api "${request[@]}" --field "body=@$body" --silent 2>&1)"; then
            if grep --quiet 'HTTP 403' <<< "$output"; then
              echo "::warning::The token cannot write comments on this pull request. No comment was posted."
              exit 0
            fi
            echo "$output" >&2
            exit 1
          fi
