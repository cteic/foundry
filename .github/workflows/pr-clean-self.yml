name: PR clean (self)

# Calls the reusable PR clean workflow from this commit, so a change to it or
# to pr-clean checks this repo before any app picks it up.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-clean:
    uses: ./.github/workflows/pr-clean.yml
